<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilos/estilos..css">
</head>
<body>
    <div class="contenido">
        <h1>Contáctame</h1>
        <form>
            <label>Correo:</label>
            <input type="email" name="correo" required>

            <label>Nombre:</label>
            <input type="text" name="nombre" required>

            <label>Mensaje:</label>
            <textarea name="mensaje" rows="10" required></textarea>

            <button type="submit">Enviar</button>
        </form>
        <div class="iframe-container">

            <iframe class="iframe-maps" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7894.470621996028!2d-74.54800845566278!3d-8.37849990227874!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2spe!4v1772600675616!5m2!1ses-419!2spe" width="400" height="200" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </div>
</body>
</html>
